version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # The MCP SDK packages are versioned together and must move together.
      mcp-sdk:
        patterns:
          - "@modelcontextprotocol/*"
      dev-tooling:
        dependency-type: development
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
